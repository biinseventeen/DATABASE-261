        <UserObject label="" mermaidData="{&#xa;  &quot;data&quot;: &quot;erDiagram\n    %% Shopee-style marketplace - revised EERD (v2)\n    %% Solid line  = identifying link (the child&#39;s primary key contains the parent&#39;s key)\n    %% Dashed line = non-identifying link (plain foreign key)\n    %% \&quot;derived\&quot; attributes are NOT stored: Age, Total_Amount, Average_Rating are computed.\n    %% Not expressible in this notation: USER is an OVERLAPPING, TOTAL specialization\n    %% (every user is a Buyer, a Seller, or both); ORDERED is the M:N between Orders and Product_Variant.\n\n    Users {\n        int User_ID PK\n        string Username UK\n        string Fullname\n        string Password\n        string Email UK\n        string Gender\n        date Date_of_Birth\n        int Age \&quot;derived\&quot;\n    }\n    User_Phone {\n        int User_ID PK, FK\n        string Phone_Number PK\n    }\n    Address {\n        int User_ID PK, FK\n        string Street PK\n        string Ward PK\n        string District PK\n        string City PK\n        string Address_Type\n    }\n    Buyer {\n        int User_ID PK, FK\n    }\n    Seller {\n        int User_ID PK, FK\n        string Shop_Name\n        string Shop_Description\n        string Tax_ID\n    }\n    Voucher {\n        string Voucher_Code PK\n        int Discount_Percent \&quot;10 to 50\&quot;\n        decimal Min_Order_Value\n        decimal Max_Discount_Amount \&quot;NEW cap per order\&quot;\n        int Quantity \&quot;NEW total uses\&quot;\n        date Start_Date\n        date End_Date\n    }\n    Buyer_Voucher {\n        int Buyer_ID PK, FK\n        string Voucher_Code PK, FK\n    }\n    Category {\n        int Category_ID PK\n        string Category_Name\n        int Parent_Category_ID FK\n    }\n    Product {\n        int Product_ID PK\n        string Name\n        string Description\n        int Category_ID FK\n        int Seller_ID FK\n        decimal Average_Rating \&quot;derived\&quot;\n    }\n    Product_Variant {\n        int Variant_ID PK \&quot;NEW entity\&quot;\n        int Product_ID FK\n        string Variant_Name\n        decimal Current_Price \&quot;moved from Product\&quot;\n        int Stock_Quantity \&quot;moved from Product\&quot;\n    }\n    Product_Image {\n        int Product_ID PK, FK\n        string Image_URL PK\n    }\n    Review {\n        int Product_ID PK, FK\n        int Review_ID PK\n        int Rating_Score\n        string Comment\n        datetime Review_Date\n        int Buyer_ID FK\n    }\n    Shipping_Company {\n        int Company_ID PK\n        string Company_Name\n    }\n    Orders {\n        int Order_ID PK\n        datetime Order_Date\n        string Status\n        decimal Shipping_Fee\n        datetime Delivered_At \&quot;NEW\&quot;\n        int Company_ID FK\n        string Voucher_Code FK\n        int Buyer_ID FK\n        string Street FK\n        string Ward FK\n        string District FK\n        string City FK\n        decimal Total_Amount \&quot;derived\&quot;\n    }\n    Order_Detail {\n        int Order_ID PK, FK\n        int Variant_ID PK, FK\n        int Purchased_Quantity\n        decimal Unit_Price_At_Order_Time\n    }\n    Payment {\n        int Payment_ID PK\n        string Method\n        decimal Amount\n        string Payment_Status\n        datetime Paid_Date\n        int Order_ID FK\n    }\n    Return_Request {\n        int Return_ID PK\n        datetime Request_Date\n        string Reason\n        string Return_Status\n        decimal Refund_Amount\n        int Order_ID FK\n        int Buyer_ID FK\n    }\n\n    Users ||--o{ User_Phone : \&quot;has phone\&quot;\n    Users ||--o{ Address : \&quot;has address\&quot;\n    Users ||--o| Buyer : \&quot;may be\&quot;\n    Users ||--o| Seller : \&quot;may be\&quot;\n\n    Seller ||..o{ Product : sells\n    Category ||..o{ Product : contains\n    Category |o..o{ Category : \&quot;parent of\&quot;\n    Product ||..|{ Product_Variant : \&quot;offered as\&quot;\n    Product ||--o{ Product_Image : \&quot;shown by\&quot;\n    Product ||--o{ Review : receives\n    Buyer ||..o{ Review : writes\n\n    Buyer ||..o{ Orders : places\n    Address ||..o{ Orders : \&quot;delivered to\&quot;\n    Shipping_Company ||..o{ Orders : \&quot;shipped by\&quot;\n    Voucher |o..o{ Orders : \&quot;applied to\&quot;\n    Buyer ||--o{ Buyer_Voucher : receives\n    Voucher ||--o{ Buyer_Voucher : \&quot;given as\&quot;\n\n    Orders ||--|{ Order_Detail : contains\n    Product_Variant ||--o{ Order_Detail : \&quot;ordered in\&quot;\n    Orders ||..o| Payment : \&quot;paid by\&quot;\n    Orders ||..o{ Return_Request : \&quot;has\&quot;\n    Buyer ||..o{ Return_Request : requests\n&quot;,&#xa;  &quot;config&quot;: null,&#xa;  &quot;version&quot;: &quot;12&quot;&#xa;}" id="rHbaBzAD_MnNAPn9ifIn-841">
